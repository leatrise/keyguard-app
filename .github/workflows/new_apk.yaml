name: "New APK"

on:
  workflow_dispatch:
  push:
    branches:
      - feature

permissions:
  contents: read

jobs:
  build-android-app:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.name-apk.outputs.name }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
      - uses: ./.github/actions/setup_android_ndk
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"
      - name: "Prefetch locked native crypto graph"
        run: cargo fetch --manifest-path util/crypto/rust/Cargo.toml --locked
      - name: "Prepare env"
        run: |
          echo ${{ secrets.KEYSTORE_B64 }} | base64 -d | zcat >> androidApp/keyguard-release.keystore
          echo ${{ secrets.KEYSTORE_PROPS_B64 }} | base64 -d | zcat >> androidApp/keyguard-release.properties
          echo ${{ secrets.GOOGLE_SERVICES }} | base64 -d | zcat >> androidApp/google-services.json
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/AChep/keyguard-app.git
          else
            git remote add upstream https://github.com/AChep/keyguard-app.git
          fi
          git fetch --no-tags upstream master:refs/remotes/upstream/master
          build_number=$(git rev-list --count upstream/master..HEAD)
          echo "" >> gradle.properties
          echo "versionRef=$(git rev-parse --short HEAD)" >> gradle.properties
          echo "versionCode=$build_number" >> gradle.properties
          echo buildkonfig.flavor=release >> gradle.properties
      - uses: ./.github/actions/build_android_licenses
        with:
          build-flavor: "None"
      - name: "Build"
        run: >-
          ./gradlew
          :androidApp:assembleNoneRelease
          -Pkeyguard.nativeCrypto.cargoOffline=true
      - name: "Inspect packaged native crypto"
        run: >-
          python scripts/inspect_native_crypto_android.py
          androidApp/build/outputs/apk/none/release/androidApp-none-release.apk
      - name: "Reject Bouncy Castle and SSHJ from packaged APK"
        run: >-
          python scripts/check_bouncycastle_policy.py --artifact
          androidApp/build/outputs/apk/none/release/androidApp-none-release.apk
      - name: "Name APK"
        id: name-apk
        shell: bash
        run: |
          metadata=androidApp/build/outputs/apk/none/release/output-metadata.json
          version_name=$(jq -er '.elements[0].versionName' "$metadata")
          version_code=$(jq -er '.elements[0].versionCode' "$metadata")
          source_name=$(jq -er '.elements[0].outputFile' "$metadata")
          apk_dir=$(dirname "$metadata")
          apk_name="keyguard-${version_name}(${version_code}).apk"
          mv "$apk_dir/$source_name" "$apk_dir/$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"
      - name: 'Upload .apk'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.name-apk.outputs.name }}
          path: |
            androidApp/build/outputs/apk/none/release/${{ steps.name-apk.outputs.name }}
            androidApp/build/outputs/mapping/**/mapping.txt
          retention-days: 7

  notify:
    runs-on: ubuntu-latest
    needs: build-android-app
    if: github.event_name == 'push' && needs.build-android-app.result == 'success'

    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-android-app.outputs.apk_name }}
          path: artifacts/apk

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RAW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notification skipped: missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID."
            exit 0
          fi

          escape_html() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          commit_message=$(printf '%s' "${RAW_COMMIT_MESSAGE:0:600}" | escape_html)
          commit_author=$(printf '%s' "$COMMIT_AUTHOR" | escape_html)
          commit_url=$(printf '%s' "$COMMIT_URL" | escape_html)
          caption=$(printf 'New push to GitHub!\n#keyguard\n<pre>%s</pre>\nby <code>%s</code>\n%s' \
            "$commit_message" "$commit_author" "$commit_url")

          apk_path=$(find artifacts/apk -type f -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo "No release APK artifact found after download."
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${apk_path};filename=$(basename "$apk_path")" \
            -F "parse_mode=HTML" \
            --form-string "caption=${caption}" \
            -F "disable_web_page_preview=true"
